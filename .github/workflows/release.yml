name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag and notes
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' HeadOrbit/Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' HeadOrbit/Info.plist)
          echo "EXPECTED_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Replay tests
        run: DEVELOPER_DIR="$(xcode-select -p)" ./script/test.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build and package DMG
        run: ./package.sh

      - name: Verify bundle metadata and checksum
        run: |
          APP=build/Build/Products/Release/HeadOrbit.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Contents/Info.plist")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$BUILD" = "$EXPECTED_BUILD"
          codesign --verify --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/HeadOrbit" > dist/ARCHITECTURES.txt
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt dist/ARCHITECTURES.txt \
            --verify-tag --prerelease --title "HeadOrbit $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
